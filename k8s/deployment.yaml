apiVersion: apps/v1
kind: Deployment
metadata:
  name: hotel-api
  namespace: hotel-booking
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hotel-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: hotel-api
    spec:
      containers:
        - name: hotel-api
          image: ghcr.io/singhnikh99677-ctrl/hotel-booking:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: hotel-booking-secret
                  key: SECRET_KEY
            - name: ADMIN_REGISTRATION_KEY
              valueFrom:
                secretKeyRef:
                  name: hotel-booking-secret
                  key: ADMIN_REGISTRATION_KEY
            - name: DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: hotel-booking-config
                  key: DATABASE_URL
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: hotel-booking-config
                  key: LOG_LEVEL
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
