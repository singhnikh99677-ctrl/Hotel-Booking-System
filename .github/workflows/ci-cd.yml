name: Hotel Booking CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  ci:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      # ==========================================
      # CHECKOUT
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # PYTHON
      # ==========================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ==========================================
      # INSTALL DEPENDENCIES
      # ==========================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ==========================================
      # SECURITY - BANDIT
      # ==========================================
      - name: Run Bandit
        run: |
          bandit -r app

      # ==========================================
      # SECURITY - PIP AUDIT
      # ==========================================
      - name: Run pip-audit
        run: |
          pip-audit -r requirements.txt

      # ==========================================
      # TESTS
      # ==========================================
      - name: Run pytest
        run: |
          pytest

      # ==========================================
      # COVERAGE
      # ==========================================
      - name: Coverage report
        run: |
          pytest --cov=app --cov-report=term-missing

      # ==========================================
      # DOCKER BUILD
      # ==========================================
      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/hotel-booking:${{ github.sha }} \
            -t ghcr.io/${{ github.repository_owner }}/hotel-booking:latest .

      # ==========================================
      # GHCR LOGIN
      # ==========================================
      - name: Login to GHCR
        if: github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u ${{ github.actor }} \
            --password-stdin

      # ==========================================
      # PUSH DOCKER IMAGE TO GHCR
      # ==========================================
      - name: Push Docker image to GHCR
        if: github.event_name == 'push'
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/hotel-booking:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/hotel-booking:latest


  # ==================================================
  # CONTINUOUS DEPLOYMENT
  # ==================================================
  cd:
    needs: ci
    runs-on: ubuntu-latest

    if: github.ref == 'refs/heads/main'

    environment: production

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # CHECK KUBERNETES SECRET
      # ==========================================
      - name: Check Kubernetes configuration
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          if [ -z "$KUBE_CONFIG" ]; then
            echo "KUBE_CONFIG secret is not configured."
            echo "Kubernetes deployment will be skipped."
            exit 0
          fi

          echo "KUBE_CONFIG secret is configured."

      # ==========================================
      # INSTALL KUBECTL
      # ==========================================
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      # ==========================================
      # CONFIGURE KUBECTL
      # ==========================================
      - name: Configure kubectl
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          if [ -z "$KUBE_CONFIG" ]; then
            echo "KUBE_CONFIG secret is not configured."
            echo "Skipping kubectl configuration."
            exit 0
          fi

          mkdir -p "$HOME/.kube"

          echo "$KUBE_CONFIG" > "$HOME/.kube/config"

          chmod 600 "$HOME/.kube/config"

          echo "kubectl configuration completed."

      # ==========================================
      # VERIFY KUBERNETES CONNECTION
      # ==========================================
      - name: Verify Kubernetes connection
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          if [ -z "$KUBE_CONFIG" ]; then
            echo "KUBE_CONFIG secret is not configured."
            echo "Skipping Kubernetes connection test."
            exit 0
          fi

          kubectl cluster-info

      # ==========================================
      # DEPLOY TO KUBERNETES
      # ==========================================
      - name: Deploy to Kubernetes
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          if [ -z "$KUBE_CONFIG" ]; then
            echo "KUBE_CONFIG secret is not configured."
            echo "Skipping Kubernetes deployment."
            exit 0
          fi

          kubectl apply -f k8s/

      # ==========================================
      # ROLLOUT STATUS
      # ==========================================
      - name: Check deployment rollout
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          if [ -z "$KUBE_CONFIG" ]; then
            echo "KUBE_CONFIG secret is not configured."
            echo "Skipping rollout status check."
            exit 0
          fi

          kubectl rollout status deployment/hotel-api -n hotel-booking

      # ==========================================
      # DEPLOYMENT INFORMATION
      # ==========================================
      - name: Deployment info
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          if [ -z "$KUBE_CONFIG" ]; then
            echo "=========================================="
            echo "Kubernetes deployment skipped."
            echo "=========================================="
            echo ""
            echo "Reason:"
            echo "KUBE_CONFIG GitHub Secret is not configured."
            echo ""
            echo "CI pipeline completed successfully."
            echo "Docker image was built successfully."
            echo ""
            echo "To enable Kubernetes deployment:"
            echo "Add KUBE_CONFIG under:"
            echo "GitHub Repository -> Settings -> Secrets and variables -> Actions"
            echo "=========================================="
          else
            echo "=========================================="
            echo "Kubernetes deployment completed."
            echo "=========================================="
          fi